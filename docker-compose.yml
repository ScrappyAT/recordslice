services:
  db:
    image: postgres:17
    container_name: recordslice-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: recordslice
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: recordslice
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U recordslice" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
